<!doctype html>
<html>
  <head>
    <title>Penggunaan Object</title>
  </head>
  <body>
    <script type="text/javascript">
      //membuat object dengan construtor

      function orang(nama, gender, umur, alamat) {
        this.nama = nama;
        this.gender = gender;
        this.umur = umur;
        this.alamat = alamat;
      }

      //membuat instance object
      var Dewasa = new orang("Devana", "M", 19, [
        "jalan sukoharjo",
        "kab kediri",
        "Jawa Timur",
      ]);

      console.log(Dewasa);
    </script>
  </body>
</html>
