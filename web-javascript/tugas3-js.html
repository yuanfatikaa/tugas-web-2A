<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 javascript</title>
</head>
<body>
    <h1>Tugas 3 javascript</h1>
    
    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        //penjumlahan 
        let hasil1 = angka1 + angka2;
        document.write("hasil penjumlahan: " +
        hasil1 + "<br>");
        //pengurangan
        let hasil2 = angka1 - angka2;
        document.write("hasil pengurangan: " +
        hasil2 + "<br>");
        //perkalian
        let hasil3 = angka1 * angka2;
        document.write("hasil perkalian: " +
        hasil3 + "<br>");
        //pembagian
        let hasil4 = angka1 / angka2;
        document.write("hasil penjumlahan: " +
        hasil4 + "<br>");

    </script>
</body>
</html>
